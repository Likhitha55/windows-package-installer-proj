---
# tasks file for deploy-installer
# Copy .zip to Windows VM, extract, install all tools, verify
# It will be executed against Windows VM via WinRM

# ── Step 1: Create install directory ──
- name: Create install directory
  win_file:
    path: "{{ install_dir }}"
    state: directory
    
- name: Copy package to VM
  win_copy:
    src: "{{ package_path }}"
    dest: "{{ install_dir }}\\devops-toolkit-package.zip"
  # win_copy = copies file FROM Linux agent TO Windows VM
  # Creates C:\DevOpsToolkit on the Windows VM
  # defaults for this module (( install_dir: C:\DevOpsToolkit ))
  # package_path is passed from the pipeline as extra variable (-e)

# ── Step 2: Extract .zip ──
- name: Unzip package
  win_unzip:
    src: "{{ install_dir }}\\devops-toolkit-package.zip"
    dest: "{{ install_dir }}"
  # win_unzip = extracts zip on Windows
  # After this: C:\DevOpsToolkit\components\*.exe


- name: Check what files exist
  win_command: cmd /c dir C:\DevOpsToolkit /s /b
  register: file_list

- name: Show files
  debug:
    msg: "{{ file_list.stdout_lines }}"

# ── Step 4: Install Notepad++ ──
- name: Install Notepad++
  win_shell: |
    Start-Process -FilePath "{{ install_dir }}\\DevOpsToolkit\\components\\npp-installer.exe" `
      -ArgumentList '/S' -Wait -PassThru | Out-Null
    Write-Output "Notepad++ installed"
  register: npp_result
  args:
    creates: "C:\\Program Files\\Notepad++\\notepad++.exe"

- name: Wait for registry to settle after Notepad++
  win_shell: Start-Sleep -Seconds 10

# ── Step 5: Install Git (silent, separate process) ──
- name: Install Git
  win_shell: |
    Start-Process -FilePath "{{ install_dir }}\\DevOpsToolkit\\components\\git-installer.exe" `
      -ArgumentList '/VERYSILENT','/NORESTART','/NOCANCEL','/SP-' -Wait -PassThru | Out-Null
    Write-Output "Git installed"
  register: git_result
  args:
    creates: "C:\\Program Files\\Git\\bin\\git.exe"
  # /VERYSILENT = Git's flag for completely silent install
  # /NORESTART = don't restart the computer

- name: Wait for registry to settle after Git
  win_shell: Start-Sleep -Seconds 10




# ── Step 6: Install Python ──
- name: Install Python
  win_shell: |
    Start-Process -FilePath "{{ install_dir }}\\DevOpsToolkit\\components\\python-installer.exe" `
      -ArgumentList '/quiet','InstallAllUsers=1','PrependPath=1' -Wait -PassThru | Out-Null
    Write-Output "Python installed"
  register: python_result
  # args:
  #   creates: "C:\\Program Files\\Python*\\python.exe"
  # /quiet = silent install
  # InstallAllUsers=1 = install for all users
  # PrependPath=1 = add Python to system PATH

- name: Wait for registry to settle after Python
  win_shell: Start-Sleep -Seconds 10

  

# ── Step 7: Install AWS CLI ──
- name: Install AWS CLI
  win_shell: |
    Start-Process -FilePath "msiexec.exe" `
      -ArgumentList '/i',"{{ install_dir }}\\DevOpsToolkit\\components\\awscli-installer.msi",'/quiet','/norestart' `
      -Wait -PassThru | Out-Null
    Write-Output "AWS CLI installed"
  register: awscli_result

- name: Wait for registry to settle after AWS CLI
  win_shell: Start-Sleep -Seconds 10


# ── Step 8: Refresh PATH ──
- name: Refresh environment PATH
  win_shell: |
    $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
  # After installing tools, PATH needs refresh
  # Otherwise git --version etc. won't work


# ── Step 9: Verify all installations ──
- name: Verify installations
  win_shell: |
    $results = @()
    
    # Check Notepad++
    if (Test-Path "C:\Program Files\Notepad++\notepad++.exe") {
      $results += "Notepad++: INSTALLED"
    } else { $results += "Notepad++: NOT FOUND" }
    
    # Check Git
    $gitPath = Get-Command git -ErrorAction SilentlyContinue
    if ($gitPath) {
      $gitVer = git --version
      $results += "Git: $gitVer"
    } else { $results += "Git: NOT FOUND" }
    
    # Check Python
    $pyPath = Get-Command python -ErrorAction SilentlyContinue
    if ($pyPath) {
      $pyVer = python --version
      $results += "Python: $pyVer"
    } else { $results += "Python: NOT FOUND" }
    
    # Check AWS CLI
    $awsPath = Get-Command aws -ErrorAction SilentlyContinue
    if ($awsPath) {
      $awsVer = aws --version
      $results += "AWS CLI: $awsVer"
    } else { $results += "AWS CLI: NOT FOUND" }
    
    $results | ForEach-Object { Write-Output $_ }
  register: verify_result

- name: Show verification results
  debug:
    msg: "{{ verify_result.stdout_lines }}"




